name: Release

# Push a tag like v1.2.3 to test, build and publish a GitHub release with the DMG.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Optional Developer ID signing + notarization. Leave these secrets unset for an
      # ad-hoc signed build (users then need "Open Anyway" on first launch).
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}          # base64 of the .p12
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}              # "Developer ID Application: Name (TEAMID)"
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}                      # app-specific password
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Tag must look like v1.2.3 (got '$GITHUB_REF_NAME')"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version

      - name: Test
        run: Tests/run-tests.sh

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12 != '' && env.MACOS_SIGN_IDENTITY != ''
        run: |
          keychain="$RUNNER_TEMP/diskscope-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          cert="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # Search the temporary keychain first, and make it the default so codesign and
          # notarytool find the identity and the credentials profile there.
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"; line="${line#\"}"; line="${line%\"}"
            [[ -n "$line" ]] && existing+=("$line")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security default-keychain -d user -s "$keychain"
          {
            echo "SIGNING_KEYCHAIN=$keychain"
            echo "SIGN_IDENTITY=$MACOS_SIGN_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: env.SIGNING_KEYCHAIN != '' && env.NOTARY_APPLE_ID != '' && env.NOTARY_TEAM_ID != '' && env.NOTARY_PASSWORD != ''
        run: |
          xcrun notarytool store-credentials diskscope-notary \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" \
            --keychain "$SIGNING_KEYCHAIN"
          echo "NOTARY_PROFILE=diskscope-notary" >> "$GITHUB_ENV"

      # build-app.sh reads VERSION, BUILD_NUMBER, SIGN_IDENTITY (default: ad-hoc) and NOTARY_PROFILE.
      - name: Build universal app and DMG
        run: ./build-app.sh --dmg

      - name: Verify
        run: |
          dmg="build/DiskScope-$VERSION.dmg"
          codesign --verify --strict --deep build/DiskScope.app
          lipo -archs build/DiskScope.app/Contents/MacOS/DiskScope
          hdiutil verify "$dmg"
          (cd build && shasum -a 256 "DiskScope-$VERSION.dmg" | tee "DiskScope-$VERSION.dmg.sha256")

      - name: Write release notes
        run: |
          dmg="DiskScope-$VERSION.dmg"
          sha="$(awk '{print $1}' "build/$dmg.sha256")"
          notes="$RUNNER_TEMP/notes.md"
          {
            if [[ -f ".github/release-notes/$VERSION.md" ]]; then
              cat ".github/release-notes/$VERSION.md"
              echo
            fi
            echo "## Install"
            echo
            echo "Requires macOS 14 Sonoma or later. Universal: runs natively on Apple silicon and Intel Macs."
            echo
            echo "1. Download **$dmg** below and open it."
            echo "2. Drag **DiskScope** to **Applications**."
            if [[ -n "${SIGN_IDENTITY:-}" && -n "${NOTARY_PROFILE:-}" ]]; then
              echo "3. Open DiskScope. This build is signed with a Developer ID and notarized by Apple."
            else
              echo "3. Open DiskScope. This build isn't notarized (that needs an Apple Developer ID), so macOS"
              echo "   will say it can't verify the developer. Open **System Settings › Privacy & Security**,"
              echo "   scroll down and click **Open Anyway**. On macOS 15 and later the right-click › Open"
              echo "   shortcut no longer works for this."
            fi
            echo
            echo "For complete results in protected folders (Mail, Messages…), add DiskScope under"
            echo "System Settings › Privacy & Security › Full Disk Access."
            echo
            echo "## Verify the download"
            echo
            echo '```'
            echo "shasum -a 256 $dmg"
            echo "$sha  $dmg"
            echo '```'
          } > "$notes"
          cat "$notes"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/DiskScope-$VERSION.dmg" "build/DiskScope-$VERSION.dmg.sha256" \
            --title "DiskScope $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

      - name: Remove signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true
